[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-cpu"
version = "0.1.0"
description = "Budgeted Risk-Adaptive Computing Engine for lightweight neural PDE surrogates (CPU-only)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "PyYAML>=6.0",
    "tqdm>=4.67",
    "torch>=2.15+cpu",
]

[project.scripts]
brace-run = "scripts.run_experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
